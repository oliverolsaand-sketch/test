<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZYFONIX | Video Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #070709;
            --bg-surface: rgba(18, 18, 24, 0.72);
            --bg-elevated: rgba(28, 28, 36, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-bright: rgba(255, 255, 255, 0.22);
            --text-main: #f5f5f7;
            --text-secondary: rgba(245, 245, 247, 0.62);
            --text-muted: rgba(245, 245, 247, 0.36);
            --accent: #ffffff;
            --rec-red: #ff3b30;
            --ok-green: #30d158;
            --font-display: 'Syne', sans-serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --spring: cubic-bezier(0.22, 1.35, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        ::selection {
            background: #ffffff;
            color: #070709;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #070709; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 10px; }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 100px;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-base);
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* Studio architectural grid & ambient light */
        .studio-backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                radial-gradient(850px circle at 50% -10%, rgba(255, 255, 255, 0.065), transparent 60%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 72px 72px, 72px 72px;
            mask-image: radial-gradient(ellipse 100% 90% at 50% 35%, #000 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 100% 90% at 50% 35%, #000 40%, transparent 100%);
        }

        #mouse-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 560px;
            height: 560px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.055) 0%, transparent 65%);
            border-radius: 50%;
            transform: translate3d(-50%, -50%, 0);
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: screen;
            will-change: transform;
        }

        /* Top NLE Playhead Timeline */
        #scroll-timeline {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 2000;
        }

        #scroll-timeline-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(255,255,255,0.3), #ffffff);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        .container {
            width: 100%;
            max-width: 1220px;
            margin: 0 auto;
            padding: 0 5%;
            position: relative;
            z-index: 2;
        }

        section {
            padding: clamp(70px, 10vw, 130px) 0;
            position: relative;
            z-index: 2;
        }

        /* Floating Studio Pill Navbar */
        header {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            padding: 0 20px;
            pointer-events: none;
        }

        .nav-dock {
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 36px;
            padding: 12px 24px;
            background: rgba(14, 14, 18, 0.78);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 100px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
            transition: all 0.5s var(--ease-out);
            max-width: 880px;
            width: 100%;
        }

        header.scrolled .nav-dock {
            background: rgba(10, 10, 14, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
            padding: 10px 22px;
        }

        .logo {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.14em;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--rec-red);
            box-shadow: 0 0 10px var(--rec-red);
            animation: recBlink 2s infinite;
        }

        @keyframes recBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.85); }
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 100px;
            transition: all 0.35s var(--ease-out);
        }

        .nav-links a:hover,
        .nav-links a.active-link {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-status::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ok-green);
            box-shadow: 0 0 8px var(--ok-green);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 6px;
        }

        .hamburger span {
            width: 22px;
            height: 2px;
            background: #ffffff;
            transition: 0.3s var(--ease-out);
        }

        /* Hero Section */
        #hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 110px;
            position: relative;
            overflow: hidden;
        }

        #particle-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .hero-badge-row {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 7px 16px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 28px;
            backdrop-filter: blur(12px);
        }

        .hero-badge-row span.tc {
            color: #ffffff;
            font-weight: 600;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(3.6rem, 11vw, 8.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 0.95;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #dcdce2 55%, #787882 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            filter: drop-shadow(0 20px 50px rgba(255, 255, 255, 0.12));
        }

        .hero-subtitle {
            font-family: var(--font-mono);
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: var(--text-secondary);
            letter-spacing: 0.28em;
            text-transform: uppercase;
            margin-bottom: 44px;
        }

        .hero-btns {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-solid {
            position: relative;
            overflow: hidden;
            background: #ffffff;
            color: #070709;
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            padding: 15px 34px;
            border-radius: 100px;
            border: none;
            cursor: pointer;
            transition: transform 0.45s var(--spring), box-shadow 0.45s var(--ease-out);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-solid:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 40px rgba(255, 255, 255, 0.25);
        }

        .btn {
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 15px 34px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            cursor: pointer;
            transition: all 0.45s var(--ease-out);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        /* Section Header Styling */
        .section-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 52px;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid var(--border-subtle);
            margin-bottom: 16px;
        }

        .section-label::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--rec-red);
            box-shadow: 0 0 8px var(--rec-red);
        }

        .section-title {
            font-family: var(--font-display);
            font-size: clamp(2.1rem, 4.5vw, 3.4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: #ffffff;
        }

        /* Studio Bento Cards with Spotlight Border */
        .bento-card {
            position: relative;
            overflow: hidden;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 0.55s var(--ease-out),
                border-color 0.45s var(--ease-out),
                box-shadow 0.55s var(--ease-out);
        }

        .bento-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(
                500px circle at var(--mouse-x, 50%) var(--mouse-y, -200%),
                rgba(255, 255, 255, 0.08),
                transparent 45%
            );
            opacity: 0;
            transition: opacity 0.45s var(--ease-out);
            z-index: 0;
        }

        .bento-card:hover::before {
            opacity: 1;
        }

        .bento-card > * {
            position: relative;
            z-index: 1;
        }

        .bento-card:hover {
            border-color: var(--border-bright);
            transform: translateY(-4px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        /* Bento Grid for About + Stats */
        .studio-bento-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 22px;
            margin-bottom: 22px;
        }

        .about-photo-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .about-img-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 4/5;
            border-radius: 16px;
            overflow: hidden;
            background: #121217;
        }

        .about-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.7s var(--ease-out);
        }

        .about-photo-card:hover .about-img {
            transform: scale(1.04);
        }

        .photo-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        .about-bio-card {
            padding: 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .about-bio-card p {
            font-size: 1.12rem;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 18px;
        }

        .tool-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding: 10px 18px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-secondary);
            width: fit-content;
        }

        .tool-pill strong {
            color: #ffffff;
        }

        .stats-bento-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .stat-card {
            padding: 36px 28px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
        }

        .stat-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .stat-icon {
            font-size: 24px;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .stat-number {
            font-family: var(--font-display);
            font-size: clamp(2.6rem, 5vw, 3.8rem);
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-label {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* Portfolio Creator Dock */
        .client-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
            margin-bottom: 40px;
        }

        .client-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.4s var(--ease-out);
            user-select: none;
        }

        .client-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .client-card.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        .avatar-wrap {
            position: relative;
            flex-shrink: 0;
            width: 52px;
            height: 52px;
        }

        .avatar-img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
